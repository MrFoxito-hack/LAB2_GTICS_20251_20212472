<!-- Para la tabla hacemos uso de Bootstrap -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Lista de Autos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-4">Lista de Autos</h2>

<!-- Botón para agregar -->      <!-- ruta para crear un nuevo auto -->
<a class="btn btn-primary mb-3" href="/auto/nuevo">Agregar Auto</a>

<!-- Tabla de autos usando bootstrap -->
<table class="table table-bordered table-hover table-striped">
  <thead class="table-dark">
  <tr>
    <th>ID</th>
    <th>Marca</th>
    <th>Modelo</th>
    <th>Año</th>
    <th>Editar</th>
    <th>Eliminar</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="auto : ${listaAutos}">
    <td th:text="${auto.id}"></td>
    <td th:text="${auto.marca}"></td>
    <td th:text="${auto.modelo}"></td>
    <td th:text="${auto.anio}"></td>

    <!-- Enlaces para editar y borrar transportistas -->
    <td>
      <a th:href="@{'/auto/editar/' + ${auto.id}}" class="btn btn-warning btn-sm">Editar</a>
    </td>
    <td>
      <a th:href="@{'/auto/eliminar/' + ${auto.id}}" class="btn btn-danger btn-sm">Eliminar</a>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
