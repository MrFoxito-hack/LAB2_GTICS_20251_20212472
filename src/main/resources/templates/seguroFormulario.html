<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Registrar Seguro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Registrar Seguro</h2>

<form th:action="@{/seguro/guardar}" th:object="${seguro}" method="post" class="row g-3">

  <div class="col-md-6">
    <label class="form-label">Empresa Aseguradora</label>
    <input type="text" class="form-control" th:field="*{empresaAseguradora}" required>
  </div>

  <div class="col-md-3">
    <label class="form-label">Cobertura Máxima</label>
    <input type="number" step="0.01" class="form-control" th:field="*{coberturaMaxima}" required>
  </div>

  <div class="col-md-3">
    <label class="form-label">Tarifa</label>
    <input type="number" step="0.01" class="form-control" th:field="*{tarifa}" required>
  </div>

  <div class="col-12 mt-3">
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="/seguros" class="btn btn-secondary">Cancelar</a>
  </div>
</form>

</body>
</html>
