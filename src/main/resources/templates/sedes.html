<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Sedes</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-4">Lista de Sedes</h2>

<!-- Botón para agregar --> <!-- ruta para crear una nueva sede -->
<a class="btn btn-primary mb-3" href="/sede/nueva">Agregar Sede</a>

<!-- Tabla de sedes usando Bootstrap -->
<table class="table table-bordered table-hover table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Distrito</th>
        <th>Dirección</th>
        <th>Editar</th>
        <th>Eliminar</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="sede : ${listaSedes}">
        <td th:text="${sede.idsede}"></td>
        <td th:text="${sede.distrito}"></td>
        <td th:text="${sede.direccion}"></td>
        <td>
            <a th:href="@{'/sede/editar/' + ${sede.idsede}}" class="btn btn-warning btn-sm">Editar</a>
        </td>
        <td>
            <a th:href="@{'/sede/eliminar/' + ${sede.idsede}}" class="btn btn-danger btn-sm">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
