<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrar Sede</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Registrar Sede</h2>

<form th:action="@{/sede/guardar}" th:object="${sede}" method="post" class="row g-3">
    <div class="col-md-6">
        <label class="form-label">Distrito</label>
        <input type="text" class="form-control" th:field="*{distrito}" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Dirección</label>
        <input type="text" class="form-control" th:field="*{direccion}" required>
    </div>
    <div class="col-12 mt-3">
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/sedes" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
</body>
</html>
