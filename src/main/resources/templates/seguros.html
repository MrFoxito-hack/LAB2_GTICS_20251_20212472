<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Lista de Seguros</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-4">Lista de Seguros</h2>

<!-- Botón para agregar --> <!-- ruta para crear un nuevo seguro -->
<a class="btn btn-primary mb-3" href="/seguro/nuevo">Agregar Seguro</a>

<!-- Tabla de seguros usando Bootstrap -->
<table class="table table-bordered table-hover table-striped">
  <thead class="table-dark">
  <tr>
    <th>ID</th>
    <th>Empresa Aseguradora</th>
    <th>Cobertura Máxima</th>
    <th>Tarifa</th>
    <th>Editar</th>
    <th>Eliminar</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="seguro : ${listaSeguros}">
    <td th:text="${seguro.idseguro}"></td>
    <td th:text="${seguro.empresaAseguradora}"></td>
    <td th:text="${seguro.coberturaMaxima}"></td>
    <td th:text="${seguro.tarifa}"></td>
    <td>
      <a th:href="@{'/seguro/editar/' + ${seguro.idseguro}}" class="btn btn-warning btn-sm">Editar</a>
    </td>
    <td>
      <a th:href="@{'/seguro/eliminar/' + ${seguro.idseguro}}" class="btn btn-danger btn-sm">Eliminar</a>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
